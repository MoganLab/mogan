<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mogan</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #9f9f9f;
        /* System font stack to match the native ImGui chrome. */
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color: #1a1a1a;
      }
      #root {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!--
      React shell entry. Loaded as a module; it sets up window.Module before
      stem.js (a classic script, below) runs and consumes it. stem.js is
      generated by Emscripten into the same dir as this file at build time.
    -->
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Emscripten glue + WASM program. Loaded AFTER the module script above so
      window.Module.canvas points at the <canvas> React created. The filename
      matches stem_binary_wasm ("stem.js") in xmake/stem.lua.
    -->
    <script src="./stem.js"></script>
  </body>
</html>
