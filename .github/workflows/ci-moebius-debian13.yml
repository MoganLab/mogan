name: CI for moebius on Debian 13

on:
  push:
    branches: [ main ]
    paths:
      - 'moebius/Data/**'
      - 'moebius/Kernel/**'
      - 'moebius/Scheme/**'
      - 'moebius/moebius/**'
      - 'moebius/tests/**'
      - 'moebius/xmake.lua'
      - '.github/workflows/ci-moebius-debian13.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'moebius/Data/**'
      - 'moebius/Kernel/**'
      - 'moebius/Scheme/**'
      - 'moebius/moebius/**'
      - 'moebius/tests/**'
      - 'moebius/xmake.lua'
      - '.github/workflows/ci-moebius-debian13.yml'
  workflow_dispatch:

env:
  XMAKE_ROOT: y
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    container: debian:13
    runs-on: ubuntu-latest
    steps:
      - name: Install xmake from trixie-backports
        run: |
          echo "deb http://deb.debian.org/debian trixie-backports main" >> /etc/apt/sources.list
          cat > /etc/apt/preferences.d/99backports <<'EOF'
          Package: *
          Pin: release n=trixie-backports
          Pin-Priority: 100
          EOF
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y -t trixie-backports xmake
      - name: Install dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y gcc git 7zip unzip curl build-essential \
              fonts-noto-cjk libcurl4-openssl-dev libfreetype-dev libfontconfig-dev \
              libmimalloc-dev libgit2-dev zlib1g-dev libssl-dev libjpeg62-turbo-dev cmake \
              pandoc python3.13 python3.13-venv python3-pip ninja-build \
              libdbus-1-3 libglib2.0-0t64 libegl1 libgl-dev libxkbcommon0
          update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.13 1
          python3 -m pip install --break-system-packages aqtinstall
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1
      - name: git add safe directory
        run: git config --global --add safe.directory '*'
      - name: set XMAKE_GLOBALDIR
        run: echo "XMAKE_GLOBALDIR=${{ runner.workspace }}/xmake-global" >> $GITHUB_ENV
      - name: xmake repo update
        run: xmake repo --update
      - name: cache packages from xrepo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: ${{ runner.os }}-xrepo-qt683-${{ hashFiles('**/packages.lua') }}
      - name: cache xmake
        uses: actions/cache@v4
        with:
          path: |
            build/.build_cache
          key: ${{ runner.os }}-build-qt683-${{ hashFiles('**/packages.lua') }}
      - name: config
        run: xmake config -vD --policies=build.ccache -m releasedbg --yes
      - name: build
        run: xmake build --yes -vD libmoebius
      - name: test
        run: xmake test "moebius_tests/*"
