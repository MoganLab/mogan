name: CI for moebius on macOS

on:
  push:
    branches: [ main ]
    paths:
      - 'moebius/Data/**'
      - 'moebius/Kernel/**'
      - 'moebius/Scheme/**'
      - 'moebius/moebius/**'
      - 'moebius/tests/**'
      - 'moebius/xmake.lua'
      - '.github/workflows/ci-moebius-macos.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'moebius/Data/**'
      - 'moebius/Kernel/**'
      - 'moebius/Scheme/**'
      - 'moebius/moebius/**'
      - 'moebius/tests/**'
      - 'moebius/xmake.lua'
      - '.github/workflows/ci-moebius-macos.yml'
  workflow_dispatch:

jobs:
  macosbuild:
    strategy:
      matrix:
        os: [macos-14]
        arch: [arm64]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: set XMAKE_GLOBALDIR
        run: echo "XMAKE_GLOBALDIR=${{ runner.workspace }}/xmake-global" >> $GITHUB_ENV
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.4
          actions-cache-folder: '.xmake-cache'
      - name: xmake repo update
        run: xmake repo --update
      - name: cache packages from xrepo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: xrepo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xmake/vars.lua', 'moebius/xmake.lua') }}
      - name: cache xmake
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build/.build_cache
          key: xmake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xmake/vars.lua', 'moebius/xmake.lua') }}
      - name: config
        run: xmake config --policies=build.ccache -m releasedbg --yes
      - name: build
        run: xmake build --yes -vD libmoebius
      - name: test
        run: xmake test "moebius_tests/*"
