name: CI for moebius on Windows

on:
  push:
    branches: [ main ]
    paths:
      - 'moebius/Data/**'
      - 'moebius/Kernel/**'
      - 'moebius/Scheme/**'
      - 'moebius/moebius/**'
      - 'moebius/tests/**'
      - 'moebius/bench/**'
      - 'moebius/xmake.lua'
      - '.github/workflows/ci-moebius-windows.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'moebius/Data/**'
      - 'moebius/Kernel/**'
      - 'moebius/Scheme/**'
      - 'moebius/moebius/**'
      - 'moebius/tests/**'
      - 'moebius/bench/**'
      - 'moebius/xmake.lua'
      - '.github/workflows/ci-moebius-windows.yml'
  workflow_dispatch:

jobs:
  windowsbuild:
    runs-on: windows-2019
    steps:
      - name: Set xmake global dir
        run: |
          echo "XMAKE_GLOBALDIR=${{ runner.workspace }}/.xmake-global" >> "${{ github.env }}"
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v2.8.7
      - name: update repo
        run: xmake repo -u
      - name: git crlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1
      - name: cache xmake
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
            ${{ github.workspace }}/build/.build_cache
          key: ${{ runner.os }}-xmake-${{ hashFiles('**/xmake.lua') }}
      # Force xmake to a specific folder (for cache)
      - name: config
        run: xmake config --yes -vD
      - name: build
        run: xmake build libmoebius
      - name: test
        run: xmake test "moebius_tests/*"
