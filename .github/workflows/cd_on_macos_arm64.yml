name: CD for Mogan STEM on macOS arm64

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  macosbuild:
    strategy:
      matrix:
        os: [macos-14]
        arch: [arm64]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 1
      - name: Noto fonts
        run: |
          mkdir -p $GITHUB_WORKSPACE/TeXmacs/fonts/opentype/noto
          cd $GITHUB_WORKSPACE/TeXmacs/fonts/opentype/noto
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSansCJK-Bold.ttc
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSansCJK-Regular.ttc
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSerifCJK-Bold.ttc
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSerifCJK-Regular.ttc
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v2.9.3
          actions-cache-folder: '.xmake-cache'
      - name: Install create-dmg
        run: |
          brew install create-dmg
      - name: xmake repo --update
        run: xmake repo --update
      - name: config
        run: xmake config -m release -a ${{ matrix.arch }} -vD --yes
      - name: build
        run: xmake build -vD stem
      - name: install
        run: xmake install -vD stem
      - name: Clean up mounted DMGs
        run: |
          # 卸载任何可能挂载的DMG
          hdiutil detach /Volumes/* -force 2>/dev/null || true
          diskutil unmount /Volumes/* -force 2>/dev/null || true
          # 清理临时文件
          rm -rf /tmp/create-dmg.* 2>/dev/null || true
          # 清理可能存在的挂载点
          find /Volumes -maxdepth 1 -type d -name "*" -exec umount {} \; 2>/dev/null || true
          # 等待资源释放
          sleep 3
      # ========== 代码签名和公证 ==========
      
      - name: Install Apple certificates
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      
      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          # 直接写入原始 .p8 内容（非 base64）
          cat > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8 << 'PRIVATEKEY'
          ${{ secrets.APPLE_API_KEY_P8 }}
          PRIVATEKEY
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_*.p8
          
          # 验证文件
          echo "API Key 文件大小:"
          ls -la ~/.appstoreconnect/private_keys/AuthKey_*.p8
          echo "文件头部:"
          head -1 ~/.appstoreconnect/private_keys/AuthKey_*.p8
          echo "文件尾部:"
          tail -1 ~/.appstoreconnect/private_keys/AuthKey_*.p8
      
      - name: Sign application bundle
        run: |
          # 找到 .app 目录并签名
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            # 查找可用的签名证书（Developer ID Application 或 Apple Distribution）
            IDENTITY=$(security find-identity -v -p codesigning | grep -E "(Developer ID Application|Apple Distribution)" | head -1 | sed -n 's/.*"\([^"]*\)".*/\1/p')
            if [ -z "$IDENTITY" ]; then
              echo "错误：找不到可用的签名证书"
              echo "可用的证书列表："
              security find-identity -v -p codesigning
              exit 1
            fi
            echo "使用签名身份: $IDENTITY"
            codesign --force --options runtime --deep --sign "$IDENTITY" --verbose "$APP_PATH"
          fi

      - name: Generate Installer
        run: |
          xmake install -vD stem_packager
      
      - name: Sign DMG
        run: |
          DMG_PATH=$(find build -name "*.dmg" | head -n 1)
          if [ -n "$DMG_PATH" ]; then
            IDENTITY=$(security find-identity -v -p codesigning | grep -E "(Developer ID Application|Apple Distribution)" | head -1 | sed -n 's/.*"\([^"]*\)".*/\1/p')
            codesign --force --sign "$IDENTITY" --verbose "$DMG_PATH"
          fi
      
      - name: Notarize DMG
        run: |
          DMG_PATH=$(find build -name "*.dmg" | head -n 1)
          if [ -n "$DMG_PATH" ]; then
            xcrun notarytool submit "$DMG_PATH" \
              --key ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8 \
              --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
              --issuer "${{ secrets.APPLE_API_ISSUER_ID }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --wait \
              --timeout 10m
          fi
      
      - name: Staple notarization ticket
        run: |
          DMG_PATH=$(find build -name "*.dmg" | head -n 1)
          if [ -n "$DMG_PATH" ]; then
            xcrun stapler staple "$DMG_PATH"
          fi

      - name: Upload 
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: build/*.dmg
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: true
          files: build/*.dmg