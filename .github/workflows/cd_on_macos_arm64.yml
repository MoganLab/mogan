name: CD for Mogan STEM on macOS arm64

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  macosbuild:
    strategy:
      matrix:
        os: [macos-14]
        arch: [arm64]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 1
      - name: Noto fonts
        run: |
          mkdir -p $GITHUB_WORKSPACE/TeXmacs/fonts/opentype/noto
          cd $GITHUB_WORKSPACE/TeXmacs/fonts/opentype/noto
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSansCJK-Bold.ttc
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSansCJK-Regular.ttc
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSerifCJK-Bold.ttc
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSerifCJK-Regular.ttc
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v2.9.3
          actions-cache-folder: '.xmake-cache'
      - name: Install create-dmg
        run: |
          brew install create-dmg
      - name: xmake repo --update
        run: xmake repo --update
      - name: config
        run: xmake config -m release -a ${{ matrix.arch }} -vD --yes
      - name: build
        run: xmake build -vD stem
      - name: install
        run: xmake install -vD stem
      - name: Clean up mounted DMGs
        run: |
          # 卸载任何可能挂载的DMG
          hdiutil detach /Volumes/* -force 2>/dev/null || true
          diskutil unmount /Volumes/* -force 2>/dev/null || true
          # 清理临时文件
          rm -rf /tmp/create-dmg.* 2>/dev/null || true
          # 清理可能存在的挂载点
          find /Volumes -maxdepth 1 -type d -name "*" -exec umount {} \; 2>/dev/null || true
          # 等待资源释放
          sleep 3
      # ========== 代码签名和公证 ==========
      
      - name: Install Apple certificates
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # 调试：显示信息
          echo "Base64 长度: ${#CERTIFICATE_BASE64}"
          echo "密码长度: ${#CERTIFICATE_PASSWORD}"
          echo "密码首字符: ${CERTIFICATE_PASSWORD:0:1}"
          echo "密码末字符: ${CERTIFICATE_PASSWORD: -1}"
          
          # 使用 printf 避免换行符问题
          printf '%s' "$CERTIFICATE_BASE64" | base64 -d > /tmp/certificate.p12
          
          # 验证解码后的文件
          echo "解码后文件大小:"
          ls -la /tmp/certificate.p12
          
          # 清理密码：去除所有换行符和空格
          CLEAN_PASSWORD=$(echo "$CERTIFICATE_PASSWORD" | tr -d '\n' | tr -d ' ' | tr -d '\r')
          echo "清理后密码长度: ${#CLEAN_PASSWORD}"
          
          # 使用文件传递密码验证 p12
          printf '%s' "$CLEAN_PASSWORD" > /tmp/cert_pass.txt
          echo "使用文件验证 p12:"
          openssl pkcs12 -in /tmp/certificate.p12 -noout -info -passin file:/tmp/cert_pass.txt || echo "p12 验证失败"
          
          # 创建临时 keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # 导入证书（使用清理后的密码）
          echo "导入证书..."
          security import /tmp/certificate.p12 -P "$CLEAN_PASSWORD" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security || {
            echo "证书导入失败，尝试不带 -T 参数..."
            security import /tmp/certificate.p12 -P "$CLEAN_PASSWORD" -k "$KEYCHAIN_PATH"
          }
          
          # 设置权限
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # 设置为默认 keychain
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          
          echo "证书导入成功"
          security find-identity -v -p codesigning
      
      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          # 直接写入原始 .p8 内容（非 base64）
          cat > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8 << 'PRIVATEKEY'
          ${{ secrets.APPLE_API_KEY_P8 }}
          PRIVATEKEY
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_*.p8
          
          # 验证文件
          echo "API Key 文件大小:"
          ls -la ~/.appstoreconnect/private_keys/AuthKey_*.p8
          echo "文件头部:"
          head -1 ~/.appstoreconnect/private_keys/AuthKey_*.p8
          echo "文件尾部:"
          tail -1 ~/.appstoreconnect/private_keys/AuthKey_*.p8
      
      - name: Sign application bundle
        run: |
          # 找到 .app 目录并签名
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "找到 APP: $APP_PATH"
            ls -la "$APP_PATH/Contents/Frameworks/"
            
            # 查找可用的签名证书（Developer ID Application 或 Apple Distribution）
            IDENTITY=$(security find-identity -v -p codesigning | grep -E "(Developer ID Application|Apple Distribution)" | head -1 | sed -n 's/.*"\([^"]*\)".*/\1/p')
            if [ -z "$IDENTITY" ]; then
              echo "错误：找不到可用的签名证书"
              echo "可用的证书列表："
              security find-identity -v -p codesigning
              exit 1
            fi
            echo "使用签名身份: $IDENTITY"
            
            # 1. 先签名所有内部的动态库和可执行文件
            echo "签名内部动态库..."
            if [ -d "$APP_PATH/Contents/Frameworks" ]; then
              echo "找到的 dylib 文件:"
              find "$APP_PATH/Contents/Frameworks" -type f -name "*.dylib"
              echo "开始签名..."
              find "$APP_PATH/Contents/Frameworks" -type f -name "*.dylib" -print -exec codesign --force --options runtime --timestamp --sign "$IDENTITY" {} \;
            fi
            
            # 2. 签名所有 framework 内的二进制文件
            echo "签名 frameworks..."
            if [ -d "$APP_PATH/Contents/Frameworks" ]; then
              for framework in "$APP_PATH/Contents/Frameworks"/*.framework; do
                if [ -d "$framework" ]; then
                  echo "处理 framework: $framework"
                  framework_name=$(basename "$framework" .framework)
                  binary_path="$framework/Versions/A/$framework_name"
                  if [ -f "$binary_path" ]; then
                    echo "签名二进制: $binary_path"
                    codesign --force --options runtime --timestamp --sign "$IDENTITY" "$binary_path" || echo "签名失败: $binary_path"
                  fi
                  # 对整个 framework 签名
                  echo "签名整个 framework: $framework"
                  codesign --force --options runtime --timestamp --sign "$IDENTITY" "$framework" || echo "签名失败: $framework"
                fi
              done
            fi
            
            # 3. 签名 Plugins 目录（如果有）
            if [ -d "$APP_PATH/Contents/PlugIns" ]; then
              echo "签名 Plugins..."
              find "$APP_PATH/Contents/PlugIns" -type f -exec codesign --force --options runtime --timestamp --sign "$IDENTITY" {} \;
            fi
            
            # 4. 最后签名整个 app bundle
            echo "签名整个 app bundle..."
            codesign --force --options runtime --deep --timestamp --sign "$IDENTITY" "$APP_PATH"
            
            # 5. 验证签名
            echo "验证 app bundle 签名..."
            codesign -vvv "$APP_PATH" 2>&1 | head -20 || true
            
            # 6. 检查特定文件的签名状态
            echo "检查 libjpeg.8.dylib 签名状态..."
            codesign -dvv "$APP_PATH/Contents/Frameworks/libjpeg.8.dylib" 2>&1 || echo "未签名"
          fi

      - name: Generate Installer
        run: |
          xmake install -vD stem_packager
      
      - name: Re-sign and repackage
        run: |
          # stem_packager 可能重新组织了 app，签名丢失
          # 策略：解压 DMG -> 签名 -> 重新打包
          
          DMG_PATH=$(find build -name "*.dmg" | head -n 1)
          if [ -n "$DMG_PATH" ]; then
            echo "处理 DMG: $DMG_PATH"
            
            # 1. 创建临时目录
            TEMP_DIR=$(mktemp -d)
            echo "临时目录: $TEMP_DIR"
            
            # 2. 挂载 DMG
            MOUNT_POINT=$(hdiutil attach "$DMG_PATH" -nobrowse | grep -o '/Volumes/.*')
            echo "挂载点: $MOUNT_POINT"
            
            # 3. 复制 app 到临时目录
            APP_NAME=$(ls "$MOUNT_POINT" | grep "\.app$")
            cp -R "$MOUNT_POINT/$APP_NAME" "$TEMP_DIR/"
            echo "已复制 app: $TEMP_DIR/$APP_NAME"
            
            # 4. 卸载原始 DMG
            hdiutil detach "$MOUNT_POINT" -force
            
            # 5. 签名临时目录中的 app
            APP_PATH="$TEMP_DIR/$APP_NAME"
            IDENTITY=$(security find-identity -v -p codesigning | grep -E "(Developer ID Application|Apple Distribution)" | head -1 | sed -n 's/.*"\([^"]*\)".*/\1/p')
            echo "使用签名身份: $IDENTITY"
            
            echo "签名 frameworks..."
            find "$APP_PATH/Contents/Frameworks" -type f \( -name "*.dylib" -o -name "Qt*" \) -exec codesign --force --options runtime --timestamp --sign "$IDENTITY" {} \; 2>/dev/null || true
            
            for framework in "$APP_PATH/Contents/Frameworks"/*.framework; do
              if [ -d "$framework" ]; then
                framework_name=$(basename "$framework" .framework)
                binary_path="$framework/Versions/A/$framework_name"
                [ -f "$binary_path" ] && codesign --force --options runtime --timestamp --sign "$IDENTITY" "$binary_path" 2>/dev/null || true
                codesign --force --options runtime --timestamp --sign "$IDENTITY" "$framework" 2>/dev/null || true
              fi
            done
            
            if [ -d "$APP_PATH/Contents/PlugIns" ]; then
              echo "签名 PlugIns..."
              find "$APP_PATH/Contents/PlugIns" -type f -exec codesign --force --options runtime --timestamp --sign "$IDENTITY" {} \; 2>/dev/null || true
            fi
            
            # 签名 Resources/bin 下的可执行文件
            if [ -d "$APP_PATH/Contents/Resources/bin" ]; then
              echo "签名 Resources/bin..."
              find "$APP_PATH/Contents/Resources/bin" -type f -exec codesign --force --options runtime --timestamp --sign "$IDENTITY" {} \; 2>/dev/null || true
            fi
            
            # 签名插件目录下的可执行文件
            if [ -d "$APP_PATH/Contents/Resources/share/moganlab/plugins" ]; then
              echo "签名 plugins..."
              find "$APP_PATH/Contents/Resources/share/moganlab/plugins" -type f -exec codesign --force --options runtime --timestamp --sign "$IDENTITY" {} \; 2>/dev/null || true
            fi
            
            echo "签名整个 app bundle..."
            codesign --force --options runtime --deep --timestamp --sign "$IDENTITY" "$APP_PATH"
            
            echo "签名完成，验证..."
            codesign -dvv "$APP_PATH/Contents/Frameworks/libjpeg.8.dylib" 2>&1 | head -5 || true
            
            # 6. 删除原始 DMG
            rm "$DMG_PATH"
            
            # 7. 使用 create-dmg 重新打包
            echo "重新创建 DMG..."
            create-dmg \
              --volname "Mogan STEM" \
              --window-pos 200 120 \
              --window-size 800 400 \
              --icon-size 100 \
              --app-drop-link 600 185 \
              "$DMG_PATH" \
              "$APP_PATH"
            
            echo "新 DMG 已创建: $DMG_PATH"
            
            # 8. 清理临时目录
            rm -rf "$TEMP_DIR"
          fi
      
      - name: Sign DMG
        run: |
          DMG_PATH=$(find build -name "*.dmg" | head -n 1)
          if [ -n "$DMG_PATH" ]; then
            IDENTITY=$(security find-identity -v -p codesigning | grep -E "(Developer ID Application|Apple Distribution)" | head -1 | sed -n 's/.*"\([^"]*\)".*/\1/p')
            echo "签名 DMG: $DMG_PATH"
            codesign --force --timestamp --sign "$IDENTITY" --verbose "$DMG_PATH"
          fi
      
      - name: Notarize DMG
        run: |
          DMG_PATH=$(find build -name "*.dmg" | head -n 1)
          if [ -n "$DMG_PATH" ]; then
            echo "开始公证 $DMG_PATH ..."
            xcrun notarytool submit "$DMG_PATH" \
              --key ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8 \
              --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
              --issuer "${{ secrets.APPLE_API_ISSUER_ID }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --wait \
              --timeout 20m \
              --output-format json > /tmp/notary_result.json
            
            echo "公证结果:"
            cat /tmp/notary_result.json
            
            # 检查状态
            STATUS=$(cat /tmp/notary_result.json | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
            if [ "$STATUS" != "Accepted" ]; then
              echo "❌ 公证失败！状态: $STATUS"
              SUBMISSION_ID=$(cat /tmp/notary_result.json | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
              if [ -n "$SUBMISSION_ID" ]; then
                echo "获取详细日志..."
                xcrun notarytool log "$SUBMISSION_ID" \
                  --key ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8 \
                  --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
                  --issuer "${{ secrets.APPLE_API_ISSUER_ID }}" \
                  --team-id "${{ secrets.APPLE_TEAM_ID }}" 2>&1 || true
              fi
              exit 1
            fi
            echo "✅ 公证成功！"
          fi
      
      - name: Staple notarization ticket
        run: |
          DMG_PATH=$(find build -name "*.dmg" | head -n 1)
          if [ -n "$DMG_PATH" ]; then
            # 等待 Apple 服务器同步（给予足够时间）
            echo "等待公证票据同步到 Apple 服务器..."
            sleep 30
            
            # 尝试装订，最多重试 3 次
            for i in 1 2 3; do
              echo "尝试装订（第 $i 次）..."
              if xcrun stapler staple "$DMG_PATH"; then
                echo "装订成功！"
                exit 0
              fi
              echo "装订失败，等待 20 秒后重试..."
              sleep 20
            done
            
            echo "装订失败，但公证应该已完成。继续上传..."
            # 不强制退出，允许继续（公证已完成，只是没装订）
          fi

      - name: Upload 
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: build/*.dmg
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: true
          files: build/*.dmg