name: Clang-Format Check on Debian 13

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "!src/Plugins/Macos/**"
      - "!src/Plugins/Windows/**"
      - "tests/**"
      - "moebius/**"
      - "3rdparty/lolly/**"
      - "TeXmacs/progs/**"
      - "TeXmacs/plugins/**"
      - ".clang-format"
      - "gf_fmt.json"
      - "gfproject.json"
      - ".github/workflows/ci-format-check-debian13.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "!src/Plugins/Macos/**"
      - "!src/Plugins/Windows/**"
      - "tests/**"
      - "moebius/**"
      - "3rdparty/lolly/**"
      - "TeXmacs/progs/**"
      - "TeXmacs/plugins/**"
      - ".clang-format"
      - "gf_fmt.json"
      - "gfproject.json"
      - ".github/workflows/ci-format-check-debian13.yml"
  workflow_dispatch:

jobs:
  clang-format-check:
    container: debian:13
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - name: Install dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y clang-format-19 curl ca-certificates

      - uses: actions/checkout@v3
        with:
          fetch-depth: 1

      # 固定 goldfish 版本，不用 latest：新版本可能改变格式化行为，导致全部
      # 未重排的 open PR 及 main 突然挂掉（如 v18.11.40 发布后 #4745 的 CI 失败）。
      # 升级 goldfish 并用新版本重排仓库时，在同一提交里同步修改这里的版本。
      - name: Download & install goldfish (pinned)
        run: |
          TAG=v18.11.40
          echo "Pinned goldfish release: $TAG"
          curl -fsSL -o /tmp/gf.deb "https://github.com/MoganLab/goldfish/releases/download/$TAG/goldfish-scheme-x86_64-$TAG.deb"
          dpkg -i /tmp/gf.deb
          gf version

      - name: Run gf fmt --check (C++ + Scheme)
        run: gf fmt --check
