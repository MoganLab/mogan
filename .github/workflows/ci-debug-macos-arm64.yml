name: Build and Test moebius on macOS arm64

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '!src/Plugins/Windows/**'
      - 'tests/**'
      - 'xmake.lua'
      - 'xmake/packages.lua'
      - 'xmake/research.lua'
      - 'xmake/options.lua'
      - 'xmake/requires.lua'
      - 'xmake/targets/**'
      - 'xmake/packages/**'
      - 'xmake-requires.lock'
      - 'lolly/Data/**'
      - 'lolly/Kernel/**'
      - 'lolly/Plugins/**'
      - 'lolly/System/**'
      - 'lolly/lolly/**'
      - 'lolly/tests/**'
      - 'lolly/xmake.lua'
      - 'moebius/Data/**'
      - 'moebius/Kernel/**'
      - 'moebius/Scheme/**'
      - 'moebius/moebius/**'
      - 'moebius/tests/**'
      - 'moebius/xmake.lua'
      - '.github/workflows/ci-debug-macos-arm64.yml'
      - 'TeXmacs/tests/*.scm'
      - 'TeXmacs/progs/**'
      - 'TeXmacs/plugins/**'
      - '3rdparty/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - '!src/Plugins/Windows/**'
      - 'tests/**'
      - 'xmake.lua'
      - 'xmake/packages.lua'
      - 'xmake/research.lua'
      - 'xmake/options.lua'
      - 'xmake/requires.lua'
      - 'xmake/targets/**'
      - 'xmake/packages/**'
      - 'xmake-requires.lock'
      - 'lolly/Data/**'
      - 'lolly/Kernel/**'
      - 'lolly/Plugins/**'
      - 'lolly/System/**'
      - 'lolly/lolly/**'
      - 'lolly/tests/**'
      - 'lolly/xmake.lua'
      - 'moebius/Data/**'
      - 'moebius/Kernel/**'
      - 'moebius/Scheme/**'
      - 'moebius/moebius/**'
      - 'moebius/tests/**'
      - 'moebius/xmake.lua'
      - '.github/workflows/ci-debug-macos-arm64.yml'
      - 'TeXmacs/tests/*.scm'
      - 'TeXmacs/progs/**'
      - 'TeXmacs/plugins/**'
      - '3rdparty/**'

jobs:
  macosbuild:
    strategy:
      matrix:
        os: [macos-14]
        arch: [arm64]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: cache xmake
        uses: actions/cache@v4
        with:
          path: |
            ${{github.workspace}}/build/.build_cache
            /Users/runner/.xmake
          key: xmake-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('xmake/vars.lua', 'lolly/xmake.lua', 'moebius/xmake.lua') }}

      - name: set XMAKE_GLOBALDIR
        run: echo "XMAKE_GLOBALDIR=${{ runner.workspace }}/xmake-global" >> $GITHUB_ENV

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.4
          actions-cache-folder: '.xmake-cache'

      - name: xmake repo --update
        run: xmake repo --update

      - name: cache packages from xrepo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: xrepo-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('xmake/vars.lua', 'lolly/xmake.lua', 'moebius/xmake.lua') }}

      - name: config
        run: xmake config --policies=build.ccache -o ${{ runner.workspace }}/build -m releasedbg --loro=yes --qt_frontend=no --cli_frontend=yes --pdfhummus=no --yes
      - name: build moebius
        run: xmake build --yes -vD libmoebius
      - name: test moebius
        run: xmake test-with-log

      # - name: integration test
      #  run: xmake run --yes -vD --group=integration_tests
      #  env:
      #    QT_QPA_PLATFORM: offscreen
