name: CD for Mogan STEM on Windows

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  windowsbuild:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.4
      - name: update repo
        run: |
          xrepo update-repo
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1
      - uses: MinoruSekine/setup-scoop@v4.0.1
        with:
          install_scoop: 'true'
          buckets: main
          apps: wget pandoc ghostscript
          update_path: 'true'
      - name: Noto fonts
        shell: pwsh
        run: |
          mkdir D:\a\mogan\mogan\TeXmacs\fonts\opentype\noto
          cd D:\a\mogan\mogan\TeXmacs\fonts\opentype\noto
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSansCJK-Bold.ttc
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSansCJK-Regular.ttc
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSerifCJK-Bold.ttc
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSerifCJK-Regular.ttc
      - name: config
        run: xmake config --loro=yes --yes -vD -m release
      - name: build
        run: xmake build -vD stem 
      - name: install
        run: xmake install -vD stem
      - name: gs and pandoc
        run: |
          cp ~\scoop\apps\pandoc\current\pandoc.exe D:\a\mogan\mogan\build\packages\stem\data\bin
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/gs.exe
      # Velopack 已接管常规 Windows 发布（见 tools/release/*.lua）；NSIS
      # （xmake pack）仅迁移期桥接保留，迁移窗口结束、NSIS 桥接发布停用后再移除。
      # 注意：CI 产物不签名（VPK_SIGN_PARAMS 为空），正式签名在 SafeNet 签名机
      # 上通过环境变量注入 signtool 参数完成；交互式令牌不允许并发签名，签名机
      # 上须固定 --signParallel 1。
      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.0
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
      # pandoc 已在 gs and pandoc 步骤落进 bin/，stage 会把它一并摊平到暂存根。
      - name: Stage Velopack
        run: xmake l tools/release/stage_velopack.lua
      # vpk pack 在 outputDir 存在上一版本时自动生成 delta 增量包；首次发布无
      # 上一版本，只有全量包。要恢复增量发布，需在 CI 缓存/恢复上一次的
      # build/velopack_release 目录（或用 vpk download 拉取基线）。
      - name: Pack Velopack
        run: xmake l tools/release/pack_velopack.lua
      - name: Upload
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: |
            build/velopack_release/*
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: true
          files: |
            build/velopack_release/*
