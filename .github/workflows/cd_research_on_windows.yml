name: CD for Mogan STEM on Windows

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  windowsbuild:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.4
      - name: update repo
        run: |
          xrepo update-repo
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1
      - uses: MinoruSekine/setup-scoop@v4.0.1
        with:
          install_scoop: 'true'
          buckets: main
          apps: wget pandoc ghostscript dark
          update_path: 'true'
      - name: Noto fonts
        shell: pwsh
        run: |
          mkdir D:\a\mogan\mogan\TeXmacs\fonts\opentype\noto
          cd D:\a\mogan\mogan\TeXmacs\fonts\opentype\noto
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSansCJK-Bold.ttc
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSansCJK-Regular.ttc
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSerifCJK-Bold.ttc
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSerifCJK-Regular.ttc
      - name: config
        run: xmake config --loro=yes --yes -vD -m release
      - name: build
        run: xmake build -vD stem 
      - name: install
        run: xmake install -vD stem
      - name: gs and pandoc
        run: |
          cp ~\scoop\apps\pandoc\current\pandoc.exe D:\a\mogan\mogan\build\packages\stem\data\bin
          wget https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/gs.exe
      # app-local CRT：stage 从 vc_redist.x64.exe 提取运行库 DLL 进 payload，
      # 不再使用 vpk --framework（避免 Setup.exe 在用户机器上从微软 CDN 下载）。
      # vc_redist.x64.exe 由 Qt 部署（windeployqt）在 xmake install 时从构建机
      # VS 的 VC\Redist 目录自动拷入安装树 bin/（与旧 NSIS 流程一致），无需下载。
      # Velopack 已接管常规 Windows 发布（见 tools/release/*.lua）；NSIS
      # （xmake pack）仅迁移期桥接保留，迁移窗口结束、NSIS 桥接发布停用后再移除。
      # 注意：CI 产物不签名（VPK_SIGN_PARAMS 为空），正式签名在 SafeNet 签名机
      # 上通过环境变量注入 signtool 参数完成；交互式令牌不允许并发签名，签名机
      # 上须固定 --signParallel 1。
      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.0
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
      # pandoc 已在 gs and pandoc 步骤落进 bin/，stage 会把它收进暂存根 bin/
      # （$TEXMACS_PATH/bin，find-binary 按此查找）。
      - name: Stage Velopack
        run: xmake l tools/release/stage_velopack.lua
      # 从 GitHub Release 拉取上一版本的发布压缩包作为 delta 基线：vpk pack
      # 只有 outputDir 里存在上一版本 full 包时才会生成 delta。所有发布都标了
      # prerelease，releases/latest 接口拿不到，这里列出最近 100 个 release，
      # 排除 draft 和当前 tag（重跑同一 tag 时避免把自己当基线），取最新的
      # 非当前发布，wget 下载其中的 mogan-release-*.zip 并解压拣出 full 包。
      # 首次发布或 GitHub 上尚无压缩包时失败属正常，容忍跳过（没有基线时
      # pack 只出 full 包，是合法状态）。GITHUB_TOKEN 不会自动注入为环境变量，
      # 必须显式传入 secrets.GITHUB_TOKEN；为空时回退为公开仓库的匿名访问。
      - name: Fetch delta baseline from GitHub Release
        shell: pwsh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Accept        = "application/vnd.github+json"
            "User-Agent"  = "mogan-cd"
          }
          if ($env:GITHUB_TOKEN) {
            $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN"
          }
          # 仓库已由 XmacsLabs/mogan 改名为 MoganLab/mogan，这里跟随当前仓库，
          # 避免硬编码旧名依赖 GitHub 重定向
          $releases = Invoke-RestMethod -Headers $headers `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100"
          $release = $releases |
            Where-Object { -not $_.draft -and $_.tag_name -ne $env:GITHUB_REF_NAME } |
            Select-Object -First 1
          if (-not $release) {
            Write-Host "未找到上一版本 release，跳过基线（首次发布？）"
            exit 0
          }
          New-Item -ItemType Directory -Path build/velopack_baseline -Force | Out-Null
          $zip = $release.assets |
            Where-Object { $_.name -like 'mogan-release-*.zip' } |
            Select-Object -First 1
          if ($zip) {
            wget -q "$($zip.browser_download_url)" -O build/velopack_baseline.zip
            Expand-Archive -Path build/velopack_baseline.zip -DestinationPath build/velopack_baseline -Force
          } else {
            # 兼容过渡期：旧 release 直接散装上传 nupkg、没有 zip，退而下载 full 包
            $asset = $release.assets |
              Where-Object { $_.name -like '*-stable-full.nupkg' } |
              Select-Object -First 1
            if (-not $asset) {
              Write-Host "release $($release.tag_name) 没有 zip 也没有 full 包，跳过基线"
              exit 0
            }
            wget -q "$($asset.browser_download_url)" -O "build/velopack_baseline/$($asset.name)"
          }
          $full = Get-ChildItem build/velopack_baseline -Filter '*-stable-full.nupkg' |
            Select-Object -First 1
          if (-not $full) {
            Write-Host "未找到 stable full 包，跳过基线"
            exit 0
          }
          $vars = Get-Content xmake/vars.lua -Raw
          $currentVer = [regex]::Match($vars, 'XMACS_VERSION\s*=\s*"([^"]+)"').Groups[1].Value
          $baselineVer = $full.Name -replace '^Mogan-', '' -replace '-stable-full\.nupkg$', ''
          if ($baselineVer -ne $currentVer) {
            New-Item -ItemType Directory -Path build/velopack_release -Force | Out-Null
            Copy-Item $full.FullName build/velopack_release/
            Write-Host "已就位 delta 基线: $($full.Name)"
          } else {
            Write-Host "基线版本与当前版本相同（$baselineVer），跳过（重跑同一版本）"
          }
      # vpk pack 在 outputDir 存在上一版本（上一步拉取的 full 包）时自动生成
      # delta 增量包；首次发布无上一版本，只有全量包。
      - name: Pack Velopack
        run: xmake l tools/release/pack_velopack.lua
      # 把整个发布目录（Setup、Portable、full/delta nupkg、feed json）打成
      # 单一 zip，作为 GitHub Release 的唯一资产。下游（delta 基线、OSS 手动
      # 上传）下载后自行解压拣选所需文件。文件名带平台架构（win-x64），
      # 与 vpk pack 的 --runtime win-x64 保持一致。
      - name: Create release archive
        shell: pwsh
        run: |
          $vars = Get-Content xmake/vars.lua -Raw
          $ver = [regex]::Match($vars, 'XMACS_VERSION\s*=\s*"([^"]+)"').Groups[1].Value
          $archive = "build/mogan-release-$ver-win-x64.zip"
          Compress-Archive -Path build/velopack_release/* -DestinationPath $archive -CompressionLevel Optimal -Force
          Get-Item $archive | Select-Object Name, Length
      - name: Upload
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: |
            build/velopack_release/*
            build/mogan-release-*.zip
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: true
          files: |
            build/mogan-release-*.zip
